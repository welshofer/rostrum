name: Lectern
options:
  bundleIdPrefix: com.lectern
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  LecternCore:
    path: .
targets:
  Lectern:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Resources/Styles"
      - path: App/Resources/Styles
        type: folder
        buildPhase: resources
    dependencies:
      - package: LecternCore
        product: LecternCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectern.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Ad-hoc sign so the app has a stable identity — required for the login
        # keychain to persist provider keys (an unsigned binary can't).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
