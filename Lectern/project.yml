name: Lectern
options:
  bundleIdPrefix: com.lectern
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  LecternCore:
    path: .
targets:
  Lectern:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Resources/Styles"
      - path: App/Resources/Styles
        type: folder
        buildPhase: resources
    dependencies:
      - package: LecternCore
        product: LecternCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectern.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Sign with a real development identity (not ad-hoc): its designated
        # requirement is stable across rebuilds, so login-keychain items — the
        # provider API keys — survive every rebuild. Ad-hoc's cdhash changes each
        # build, which orphaned the keys and forced re-entry.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: Jay Welshofer (XP6YTXD955)"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGNING_ALLOWED: "YES"
