name: CI

# Every push is checked, not only pushes to main. Previously a branch with no
# open pull request ran NO CI at all: `push` was limited to main and
# `pull_request` needs a PR to exist, so work sat unverified until someone
# opened one — three commits did exactly that, and the first CI run of the
# batch was the one that caught a broken test.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux only, on purpose. GitHub's hosted macOS runners bill at 10x the Linux
# rate, and this workflow runs on every push to every branch — which made the
# Apple-platform jobs by far the most expensive thing in the repository.
#
# Nothing is unverified as a result; the verification moved rather than
# vanished. `scripts/verify.sh` runs the whole gate locally, including the two
# things a Linux runner genuinely cannot do: build the SwiftUI app targets, and
# open a generated deck in PowerPoint (`Tools/ppt-check.sh`). Run it before
# opening a PR — see CONTRIBUTING.md.
jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    # A branch in this repo is already covered by its `push` event; without
    # this the `pull_request` event runs everything a second time on every
    # PR push. Forks still need it — this workflow never sees their pushes.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v7
      # Oracle tests shell out to these; the pure-Swift suite passes without them.
      # fonts-dejavu-core feeds the real-font sanity oracle in FontMetricsTests.
      - name: Install oracle tools
        run: apt-get update && apt-get install -y --no-install-recommends zip unzip python3 python3-pip fonts-dejavu-core
      - name: Install python-pptx (oracle gate)
        run: python3 -m pip install --break-system-packages python-pptx || python3 -m pip install python-pptx
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
        # The Swift 6.0 toolchain's bundled swift-testing can't compile some
        # `#require` expressions on optional-chained values, so the full suite
        # runs on 6.1+. The Build step above still proves the library itself
        # compiles on Swift 6.0.
        if: matrix.swift != '6.0'
      - name: Test LecternCore (sample app core)
        run: swift test
        working-directory: Lectern
        if: matrix.swift != '6.0'
      # Was on the macOS job. It builds and runs library code, so it belongs
      # anywhere the library builds — and losing it would let the README's
      # snippets rot silently.
      - name: Run README snippets (docs can't rot)
        run: swift run ReadmeSnippets "$RUNNER_TEMP"

  # The one thing "Linux only" genuinely could not see: Apple platforms are
  # what the library primarily ships on, and Linux compiles neither the
  # Darwin side of the XML bridge (core Foundation's XMLParser), the
  # CoreText/CoreGraphics half of LecternCore's renderer, nor the SwiftUI
  # app targets at all. One macOS job on pull requests only — not per-push;
  # hosted macOS bills ~10x the Linux rate — closes that hole where it
  # matters: before a merge.
  macos:
    name: macOS (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Test Rostrum (Darwin XML branch)
        run: swift test
      - name: Test LecternCore (CoreText/CoreGraphics half included)
        run: swift test
        working-directory: Lectern
      - name: Build the Lectern app (compiled by nothing else)
        run: |
          brew install xcodegen
          Lectern/scripts/build.sh -quiet

