name: CI

# Every push is checked, not only pushes to main. Previously a branch with no
# open pull request ran NO CI at all: `push` was limited to main and
# `pull_request` needs a PR to exist, so work sat unverified until someone
# opened one — three commits did exactly that, and the first CI run of the
# batch was the one that caught a broken test.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux checks run on every push; the macOS job below covers pull requests.
# `scripts/verify.sh` adds local iOS simulator builds and app-hosted tests.
# Native PowerPoint verification remains a separate local step for relevant
# package/rendering changes — see CONTRIBUTING.md.
jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    # A branch in this repo is already covered by its `push` event; without
    # this the `pull_request` event runs everything a second time on every
    # PR push. Forks still need it — this workflow never sees their pushes.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v7
      # Oracle tests shell out to these; the pure-Swift suite passes without them.
      # fonts-dejavu-core feeds the real-font sanity oracle in FontMetricsTests.
      - name: Install oracle tools
        run: apt-get update && apt-get install -y --no-install-recommends zip unzip python3 python3-pip fonts-dejavu-core
      - name: Install python-pptx (oracle gate)
        run: python3 -m pip install --break-system-packages python-pptx || python3 -m pip install python-pptx
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
        # The Swift 6.0 toolchain's bundled swift-testing can't compile some
        # `#require` expressions on optional-chained values, so the full suite
        # runs on 6.1+. The Build step above still proves the library itself
        # compiles on Swift 6.0.
        if: matrix.swift != '6.0'
      - name: Test LecternCore (sample app core)
        run: swift test
        working-directory: Lectern
        if: matrix.swift != '6.0'
      # Was on the macOS job. It builds and runs library code, so it belongs
      # anywhere the library builds — and losing it would let the README's
      # snippets rot silently.
      - name: Run README snippets (docs can't rot)
        run: |
          python3 scripts/readme-snippets.py
          swift run ReadmeSnippets "$RUNNER_TEMP"

  # Linux does not compile the Darwin XML bridge, CoreText/CoreGraphics
  # rendering, or SwiftUI app targets. Check these on pull requests.
  macos:
    name: macOS (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Test Rostrum (Darwin XML branch)
        run: swift test
      - name: Test LecternCore (CoreText/CoreGraphics half included)
        run: swift test
        working-directory: Lectern
      - name: Build the Lectern app (compiled by nothing else)
        run: |
          brew install xcodegen
          Lectern/scripts/build.sh
