name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Swift 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
      - name: Test LecternCore (sample app core)
        run: swift test
        working-directory: Lectern

  apps:
    # The SwiftUI app targets (macOS + iOS) never compile under `swift test`,
    # so CI must build them explicitly or the shell can rot unverified. Both
    # targets deploy at 26.0 (Liquid Glass), hence the macos-26 image.
    name: Lectern apps (xcodebuild)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
        working-directory: Lectern
      - name: Build macOS app
        run: |
          xcodebuild -project Lectern.xcodeproj -scheme Lectern \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
        working-directory: Lectern
      - name: Build iOS app (simulator)
        run: scripts/build-ios.sh
        working-directory: Lectern

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      # Oracle tests shell out to these; the pure-Swift suite passes without them.
      - name: Install oracle tools
        run: apt-get update && apt-get install -y --no-install-recommends zip unzip python3
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
        # The Swift 6.0 toolchain's bundled swift-testing can't compile some
        # `#require` expressions on optional-chained values, so the full suite
        # runs on 6.1+. The Build step above still proves the library itself
        # compiles on Swift 6.0.
        if: matrix.swift != '6.0'
      - name: Test LecternCore (sample app core)
        run: swift test
        working-directory: Lectern
        if: matrix.swift != '6.0'
