name: CI

# Every push is checked, not only pushes to main. Previously a branch with no
# open pull request ran NO CI at all: `push` was limited to main and
# `pull_request` needs a PR to exist, so work sat unverified until someone
# opened one — three commits did exactly that, and the first CI run of the
# batch was the one that caught a broken test.
on:
  push:
  pull_request:
    # Include stacked PRs so their Apple platform checks run before retargeting.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux checks run on every push; the macOS job below covers pull requests.
# `scripts/verify.sh` also runs local app-hosted tests.
# Native PowerPoint verification remains a separate local step for relevant
# package/rendering changes — see CONTRIBUTING.md.
jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    # A branch in this repo is already covered by its `push` event; without
    # this the `pull_request` event runs everything a second time on every
    # PR push. Forks still need it — this workflow never sees their pushes.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v7
      # Oracle tests shell out to these; the pure-Swift suite passes without them.
      # fonts-dejavu-core feeds the real-font sanity oracle in FontMetricsTests.
      - name: Install oracle tools
        run: apt-get update && apt-get install -y --no-install-recommends zip unzip python3 python3-venv fonts-dejavu-core
      - name: Install pinned portable oracles
        run: |
          python3 -m venv "$RUNNER_TEMP/oracles"
          "$RUNNER_TEMP/oracles/bin/python3" -m pip install -r Tools/conformance/requirements.txt
          echo "$RUNNER_TEMP/oracles/bin" >> "$GITHUB_PATH"
      - name: Require oracle dependencies
        run: python3 Tools/conformance/check_dependencies.py
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test
        # The Swift 6.0 toolchain's bundled swift-testing can't compile some
        # `#require` expressions on optional-chained values, so the full suite
        # runs on 6.1+. The Build step above still proves the library itself
        # compiles on Swift 6.0.
        if: matrix.swift != '6.0'
      - name: Check portable fidelity references
        run: bash scripts/check-fidelity.sh
        if: matrix.swift != '6.0'
      - name: Check native text/table pack (portable checks only)
        run: |
          swift build --package-path Lectern --product InspectionRegression
          ROSTRUM_LECTERN_INSPECTION_BINARY="$PWD/Lectern/.build/debug/InspectionRegression" \
            PYTHONDONTWRITEBYTECODE=1 python3 Tools/native-fidelity/test_pack.py
        if: matrix.swift != '6.0'
      - name: Check optimized text preparation
        run: swift test -c release --filter 'PreparedRichTextTests|TextShaperTests|TableLayoutEngineTests|TemplateTablePaginationTests|TableColumnSizingTests|TableCellPreparationTests|TableHorizontalSpanTests|TableVerticalSpanTests|TableVerticalPaginationTests|MeasuredPaginatorTests'
        if: matrix.swift != '6.0'
      - name: Retain fidelity evidence
        uses: actions/upload-artifact@v4
        if: always() && matrix.swift != '6.0'
        with:
          name: fidelity-linux-${{ matrix.swift }}
          path: .build/fidelity-checks/
          include-hidden-files: true
      - name: Test LecternCore (sample app core)
        run: swift test
        working-directory: Lectern
        if: matrix.swift != '6.0'
      # Was on the macOS job. It builds and runs library code, so it belongs
      # anywhere the library builds — and losing it would let the README's
      # snippets rot silently.
      - name: Run README snippets (docs can't rot)
        run: |
          python3 scripts/readme-snippets.py
          swift run ReadmeSnippets "$RUNNER_TEMP"

  # Linux does not compile the Darwin XML bridge, CoreText/CoreGraphics
  # rendering, or SwiftUI app targets. Check these on pull requests.
  macos:
    name: macOS (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned portable oracles
        run: |
          python3 -m venv "$RUNNER_TEMP/oracles"
          "$RUNNER_TEMP/oracles/bin/python3" -m pip install -r Tools/conformance/requirements.txt
          echo "$RUNNER_TEMP/oracles/bin" >> "$GITHUB_PATH"
      - name: Require oracle dependencies
        run: python3 Tools/conformance/check_dependencies.py
      - name: Swift version
        run: swift --version
      - name: Test Rostrum (Darwin XML branch)
        run: swift test
      - name: Check native text/table pack (portable checks only)
        run: |
          swift build --product native-fidelity
          swift build --package-path Lectern --product InspectionRegression
          ROSTRUM_LECTERN_INSPECTION_BINARY="$PWD/Lectern/.build/debug/InspectionRegression" \
            PYTHONDONTWRITEBYTECODE=1 python3 Tools/native-fidelity/test_pack.py
      - name: Check optimized text preparation
        run: swift test -c release --filter 'PreparedRichTextTests|TextShaperTests|TableLayoutEngineTests|TemplateTablePaginationTests|TableColumnSizingTests|TableCellPreparationTests|TableHorizontalSpanTests|TableVerticalSpanTests|TableVerticalPaginationTests|MeasuredPaginatorTests'
      - name: Check portable fidelity references
        run: bash scripts/check-fidelity.sh
      - name: Retain fidelity evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-macos
          path: .build/fidelity-checks/
          include-hidden-files: true
      - name: Build and validate the Horseshoe Curve worked example
        run: swift run --package-path Examples/HorseshoeCurve/Builder HorseshoeDeck
      - name: Test LecternCore (CoreText/CoreGraphics half included)
        run: swift test
        working-directory: Lectern
      - name: Build the Lectern app (compiled by nothing else)
        run: |
          brew install xcodegen
          Lectern/scripts/build.sh
      - name: Build the Lectern iOS simulator app
        run: Lectern/scripts/build-ios.sh
      - name: Compile the isolated native test host (no test execution)
        run: Lectern/scripts/test-app.sh --build-only


  published-release-smoke:
    name: Published 1.0 consumer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: swift:6.1
    steps:
      - name: Install download tools
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      - name: Resolve and run a clean external consumer
        run: |
          mkdir -p /tmp/rostrum-release-consumer/Sources/ReleaseConsumer
          cat > /tmp/rostrum-release-consumer/Package.swift <<'SWIFT'
          // swift-tools-version:6.0
          import PackageDescription

          let package = Package(
              name: "RostrumReleaseConsumer",
              dependencies: [
                  .package(url: "https://github.com/welshofer/rostrum", exact: "1.0.0")
              ],
              targets: [
                  .executableTarget(
                      name: "ReleaseConsumer",
                      dependencies: [
                          .product(name: "Rostrum", package: "rostrum"),
                          .product(name: "RostrumLayout", package: "rostrum")
                      ]
                  )
              ]
          )
          SWIFT
          cat > /tmp/rostrum-release-consumer/Sources/ReleaseConsumer/main.swift <<'SWIFT'
          import Foundation
          import Rostrum
          import RostrumLayout

          let deck = try Presentation()
          let output = URL(fileURLWithPath: "/tmp/rostrum-release-consumer/smoke.pptx")
          try deck.save(to: output)
          print("Created \(deck.slides.count)-slide deck at \(output.path)")
          SWIFT
          swift run --package-path /tmp/rostrum-release-consumer ReleaseConsumer
      - name: Download and verify the public demo archive
        run: |
          mkdir -p /tmp/rostrum-release-assets
          cd /tmp/rostrum-release-assets
          curl --fail --location --silent --show-error --remote-name \
            https://github.com/welshofer/rostrum/releases/download/v1.0.0/rostrum-v1.0.0-demo-decks.zip
          curl --fail --location --silent --show-error --remote-name \
            https://github.com/welshofer/rostrum/releases/download/v1.0.0/SHA256SUMS
          sha256sum --check SHA256SUMS
